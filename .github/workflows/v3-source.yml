name: V3 readable source
on:
  push:
    paths: ["v3/**", "tools/sync_v3_notebook.py", "outputs/Online_PINN_PDE_Framework_V3.ipynb", ".github/workflows/v3-source.yml"]
  pull_request:
    paths: ["v3/**", "tools/sync_v3_notebook.py", "outputs/Online_PINN_PDE_Framework_V3.ipynb", ".github/workflows/v3-source.yml"]
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m compileall -q v3
      - name: Notebook source matches readable modules
        run: |
          python tools/sync_v3_notebook.py
          git diff --exit-code -- outputs/Online_PINN_PDE_Framework_V3.ipynb
      - run: pip install numpy ipywidgets
      - name: Results definitions do not import TensorFlow
        run: |
          python - <<'PY'
          import sys
          from v3 import context
          ns = context()
          assert 'tensorflow' not in sys.modules
          assert ns['release_settings']('poisson2d')['base_lr'] == 0.004
          request = ns['release_request']({'action': 'results', 'zip': 'V3_Results.zip', 'training_enabled': True})
          assert request == {'action': 'results', 'zip': 'V3_Results.zip'}
          PY
